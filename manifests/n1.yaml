apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
  labels:
    app: web-app
spec:
  replicas: "2"
  selector:
    app: web-app
    matchLabels:
      app: web-app
  template:
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: web-config
          name: web-app
          image: "nginx:latest"
          securityContext:
            allowPrivilegeEscalation: false  # hardened: prevents child processes gaining more privileges than the parent
            capabilities:
              drop:
                - ALL  # hardened: drop all Linux capabilities; add back only what's needed
          resources:
            requests:
              cpu: 100m  # hardened: prevents starvation scheduling on overloaded nodes
              memory: 128Mi  # hardened: baseline memory request for scheduler placement
            limits:
              cpu: 500m  # hardened: prevents noisy-neighbour CPU hogging
              memory: 256Mi  # hardened: bounds memory consumption to prevent node OOM
      securityContext:
        seccompProfile:
          type: RuntimeDefault  # hardened: restricts syscalls to the default runtime allowlist
    metadata:
      labels:
        app: web-app
